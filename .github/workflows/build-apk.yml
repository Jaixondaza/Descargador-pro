name: Construir APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      # --- ESTO ES LO NUEVO ---
      # Limpia cualquier caché corrupta antes de compilar
      - name: Limpiar caché de Gradle
        run: ./gradlew clean
        
      # Compila usando el wrapper del proyecto (./gradlew)
      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon
        
      - uses: actions/upload-artifact@v4
        with:
          name: DescargadorPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
